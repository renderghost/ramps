<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramps</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/type.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/input.css">
    <link rel="stylesheet" href="css/feedback.css">
    <link rel="stylesheet" href="css/special.css">
    <link rel="stylesheet" href="css/media.css">
</head>

<body>
    <div class="app">
        <div class="panel">
            <header class="panel__header">
                <div class="header-row">
                    <div class="header-row__group">
                        <h1 class="panel__title">Ramps</h1>
                        <button id="save-state" class="button button--primary" type="button">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                                <path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" />
                                <path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7" />
                                <path d="M7 3v4a1 1 0 0 0 1 1h7" />
                            </svg>
                            Save State
                        </button>
                    </div>
                    <div class="header-row__group">
                        <button id="copy-data" class="button" type="button">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                                <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
                                <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
                            </svg>
                            Copy Data
                        </button>
                        <button id="download-png-preview" class="button" type="button">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                                <path d="M12 15V3" />
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                <path d="m7 10 5 5 5-5" />
                            </svg>
                            Preview Quality
                        </button>
                        <button id="download-png-print" class="button" type="button">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                                <path d="M12 15V3" />
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                <path d="m7 10 5 5 5-5" />
                            </svg>
                            Print Quality
                        </button>
                    </div>
                </div>
                <div class="tabs" role="tablist">
                    <button class="tab" type="button" role="tab" id="tab-controls" data-tab="controls"
                        aria-selected="true" aria-controls="panel-controls">Controls</button>
                    <button class="tab" type="button" role="tab" id="tab-saved" data-tab="saved"
                        aria-selected="false" aria-controls="panel-saved">Saved</button>
                </div>
            </header>

            <div class="tab-panel" id="panel-controls" role="tabpanel" aria-labelledby="tab-controls">
            <section class="panel__section" aria-label="Colour">
                <!-- <h2 id="colour-heading">Colour</h2> -->
                <div class="sliders">
                    <div class="group">
                        <div class="field-row">
                            <label class="field-label" for="stops">Colours</label>
                            <input class="value-input" type="number" id="stops-number" min="2" max="10" step="1"
                                value="5" aria-label="Colours value">
                            <div class="slider-wrap">
                                <input class="slider" type="range" id="stops" min="2" max="10" step="1" value="5">
                                <span class="slider-tooltip" id="stops-tooltip">5</span>
                            </div>
                            <button type="button" class="button lock-button" id="lock-stops" data-lock="stops"
                                aria-pressed="false" aria-label="Lock Colours">
                                <svg class="icon icon-unlocked" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                                    focusable="false">
                                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                    <path d="M7 11V7a5 5 0 0 1 9.9-1" />
                                </svg>
                                <svg class="icon icon-locked" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                                    focusable="false">
                                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <fieldset class="group">
                        <legend class="visually-hidden">Palette</legend>
                        <div class="field-row field-row--wide">
                            <span class="field-label">Palette</span>
                            <div class="palette" id="color-picker"></div>
                            <button type="button" class="button lock-button" id="lock-palette" data-lock="palette"
                                aria-pressed="false" aria-label="Lock Palette">
                                <svg class="icon icon-unlocked" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                                    focusable="false">
                                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                    <path d="M7 11V7a5 5 0 0 1 9.9-1" />
                                </svg>
                                <svg class="icon icon-locked" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                                    focusable="false">
                                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                                </svg>
                            </button>
                        </div>
                    </fieldset>
                </div>
                <div class="button-row">
                    <button id="randomise" class="button" type="button">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                            <path d="m18 14 4 4-4 4" />
                            <path d="m18 2 4 4-4 4" />
                            <path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22" />
                            <path d="M2 6h1.972a4 4 0 0 1 3.6 2.2" />
                            <path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45" />
                        </svg>
                        Randomise Palette
                    </button>
                </div>
            </section>

            <section class="panel__section" aria-label="Form">
                <!-- <h2 id="form-heading">Form</h2> -->

                <fieldset class="group">
                    <legend class="visually-hidden">Type</legend>
                    <div class="field-row field-row--wide">
                        <span class="field-label">Type</span>
                        <div class="radios">
                            <label class="radio-option">
                                <input type="radio" name="gradient-type" value="radial" checked>
                                Radial
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="gradient-type" value="linear">
                                Linear
                            </label>
                        </div>
                        <button type="button" class="button lock-button" id="lock-type" data-lock="type"
                            aria-pressed="false" aria-label="Lock Type">
                            <svg class="icon icon-unlocked" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                                focusable="false">
                                <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                <path d="M7 11V7a5 5 0 0 1 9.9-1" />
                            </svg>
                            <svg class="icon icon-locked" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                                focusable="false">
                                <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                            </svg>
                        </button>
                    </div>
                </fieldset>

                <fieldset class="group">
                    <legend class="visually-hidden">Spread</legend>
                    <div class="field-row field-row--wide">
                        <span class="field-label">Spread</span>
                        <div class="radios">
                            <label class="radio-option">
                                <input type="radio" name="spread" value="pad">
                                Pad
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="spread" value="reflect">
                                Reflect
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="spread" value="repeat" checked>
                                Repeat
                            </label>
                        </div>
                        <button type="button" class="button lock-button" id="lock-spread" data-lock="spread"
                            aria-pressed="false" aria-label="Lock Spread">
                            <svg class="icon icon-unlocked" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                                focusable="false">
                                <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                <path d="M7 11V7a5 5 0 0 1 9.9-1" />
                            </svg>
                            <svg class="icon icon-locked" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                                focusable="false">
                                <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                            </svg>
                        </button>
                    </div>
                </fieldset>

                <div class="sliders">
                    <div class="group" data-type="radial">
                        <div class="field-row">
                            <label class="field-label" for="r">Radius</label>
                            <input class="value-input" type="number" id="r-number" min="0" max="100" step="1"
                                value="50" aria-label="Radius value">
                            <div class="slider-wrap">
                                <input class="slider" type="range" id="r" min="0" max="100" step="1" value="50">
                                <span class="slider-tooltip" id="r-tooltip">50</span>
                            </div>
                            <button type="button" class="button lock-button" id="lock-r" data-lock="r"
                                aria-pressed="false" aria-label="Lock Radius">
                                <svg class="icon icon-unlocked" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                                    focusable="false">
                                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                    <path d="M7 11V7a5 5 0 0 1 9.9-1" />
                                </svg>
                                <svg class="icon icon-locked" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                                    focusable="false">
                                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="group">
                        <div class="field-row">
                            <label class="field-label" for="skewX">Shear X</label>
                            <input class="value-input" type="number" id="skewX-number" min="-90" max="90" step="1"
                                value="0" aria-label="Shear X value">
                            <div class="slider-wrap">
                                <input class="slider" type="range" id="skewX" min="-90" max="90" step="1" value="0">
                                <span class="slider-tooltip" id="skewX-tooltip">0</span>
                            </div>
                            <button type="button" class="button lock-button" id="lock-skewX" data-lock="skewX"
                                aria-pressed="false" aria-label="Lock Shear X">
                                <svg class="icon icon-unlocked" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                                    focusable="false">
                                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                    <path d="M7 11V7a5 5 0 0 1 9.9-1" />
                                </svg>
                                <svg class="icon icon-locked" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                                    focusable="false">
                                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                                </svg>
                            </button>
                        </div>
                        <div class="field-row">
                            <label class="field-label" for="skewY">Shear Y</label>
                            <input class="value-input" type="number" id="skewY-number" min="-90" max="90" step="1"
                                value="0" aria-label="Shear Y value">
                            <div class="slider-wrap">
                                <input class="slider" type="range" id="skewY" min="-90" max="90" step="1" value="0">
                                <span class="slider-tooltip" id="skewY-tooltip">0</span>
                            </div>
                            <button type="button" class="button lock-button" id="lock-skewY" data-lock="skewY"
                                aria-pressed="false" aria-label="Lock Shear Y">
                                <svg class="icon icon-unlocked" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                                    focusable="false">
                                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                    <path d="M7 11V7a5 5 0 0 1 9.9-1" />
                                </svg>
                                <svg class="icon icon-locked" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                                    focusable="false">
                                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="group">
                        <div class="field-row">
                            <label class="field-label" for="rotate">Rotation</label>
                            <input class="value-input" type="number" id="rotate-number" min="-180" max="180" step="1"
                                value="0" aria-label="Rotation value">
                            <div class="slider-wrap">
                                <input class="slider" type="range" id="rotate" min="-180" max="180" step="1" value="0">
                                <span class="slider-tooltip" id="rotate-tooltip">0</span>
                            </div>
                            <button type="button" class="button lock-button" id="lock-rotate" data-lock="rotate"
                                aria-pressed="false" aria-label="Lock Rotation">
                                <svg class="icon icon-unlocked" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                                    focusable="false">
                                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                    <path d="M7 11V7a5 5 0 0 1 9.9-1" />
                                </svg>
                                <svg class="icon icon-locked" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                                    focusable="false">
                                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                                </svg>
                            </button>
                        </div>
                        <div class="field-row">
                            <label class="field-label" for="scaleX">Scale X</label>
                            <input class="value-input" type="number" id="scaleX-number" min="10" max="300" step="1"
                                value="100" aria-label="Scale X value">
                            <div class="slider-wrap">
                                <input class="slider" type="range" id="scaleX" min="10" max="300" step="1" value="100">
                                <span class="slider-tooltip" id="scaleX-tooltip">100</span>
                            </div>
                            <button type="button" class="button lock-button" id="lock-scaleX" data-lock="scaleX"
                                aria-pressed="false" aria-label="Lock Scale X">
                                <svg class="icon icon-unlocked" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                                    focusable="false">
                                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                    <path d="M7 11V7a5 5 0 0 1 9.9-1" />
                                </svg>
                                <svg class="icon icon-locked" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                                    focusable="false">
                                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                                </svg>
                            </button>
                        </div>
                        <div class="field-row">
                            <label class="field-label" for="scaleY">Scale Y</label>
                            <input class="value-input" type="number" id="scaleY-number" min="10" max="300" step="1"
                                value="100" aria-label="Scale Y value">
                            <div class="slider-wrap">
                                <input class="slider" type="range" id="scaleY" min="10" max="300" step="1" value="100">
                                <span class="slider-tooltip" id="scaleY-tooltip">100</span>
                            </div>
                            <button type="button" class="button lock-button" id="lock-scaleY" data-lock="scaleY"
                                aria-pressed="false" aria-label="Lock Scale Y">
                                <svg class="icon icon-unlocked" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                                    focusable="false">
                                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                    <path d="M7 11V7a5 5 0 0 1 9.9-1" />
                                </svg>
                                <svg class="icon icon-locked" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                                    focusable="false">
                                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="group" data-type="radial">
                        <div class="field-row">
                            <label class="field-label" for="cx">Centre X</label>
                            <input class="value-input" type="number" id="cx-number" min="0" max="100" step="1"
                                value="50" aria-label="Centre X value">
                            <div class="slider-wrap">
                                <input class="slider" type="range" id="cx" min="0" max="100" step="1" value="50">
                                <span class="slider-tooltip" id="cx-tooltip">50</span>
                            </div>
                            <button type="button" class="button lock-button" id="lock-cx" data-lock="cx"
                                aria-pressed="false" aria-label="Lock Centre X">
                                <svg class="icon icon-unlocked" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                                    focusable="false">
                                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                    <path d="M7 11V7a5 5 0 0 1 9.9-1" />
                                </svg>
                                <svg class="icon icon-locked" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                                    focusable="false">
                                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                                </svg>
                            </button>
                        </div>
                        <div class="field-row">
                            <label class="field-label" for="cy">Centre Y</label>
                            <input class="value-input" type="number" id="cy-number" min="0" max="100" step="1"
                                value="50" aria-label="Centre Y value">
                            <div class="slider-wrap">
                                <input class="slider" type="range" id="cy" min="0" max="100" step="1" value="50">
                                <span class="slider-tooltip" id="cy-tooltip">50</span>
                            </div>
                            <button type="button" class="button lock-button" id="lock-cy" data-lock="cy"
                                aria-pressed="false" aria-label="Lock Centre Y">
                                <svg class="icon icon-unlocked" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                                    focusable="false">
                                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                    <path d="M7 11V7a5 5 0 0 1 9.9-1" />
                                </svg>
                                <svg class="icon icon-locked" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                                    focusable="false">
                                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="group" data-type="linear">
                        <div class="field-row">
                            <label class="field-label" for="startX">Start X</label>
                            <input class="value-input" type="number" id="startX-number" min="0" max="100" step="1"
                                value="0" aria-label="Start X value">
                            <div class="slider-wrap">
                                <input class="slider" type="range" id="startX" min="0" max="100" step="1" value="0">
                                <span class="slider-tooltip" id="startX-tooltip">0</span>
                            </div>
                            <button type="button" class="button lock-button" id="lock-startX" data-lock="startX"
                                aria-pressed="false" aria-label="Lock Start X">
                                <svg class="icon icon-unlocked" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                                    focusable="false">
                                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                    <path d="M7 11V7a5 5 0 0 1 9.9-1" />
                                </svg>
                                <svg class="icon icon-locked" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                                    focusable="false">
                                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                                </svg>
                            </button>
                        </div>
                        <div class="field-row">
                            <label class="field-label" for="startY">Start Y</label>
                            <input class="value-input" type="number" id="startY-number" min="0" max="100" step="1"
                                value="50" aria-label="Start Y value">
                            <div class="slider-wrap">
